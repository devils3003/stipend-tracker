name: Nightly Supabase Backup

on:
  schedule:
    # Runs every night at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows you to trigger it manually

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install PostgreSQL Client 17
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Dump Database Schema and Data
        env:
          DB_CONNECTION_STRING: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p backups
          # Bypassing shortcuts by targeting the explicit v17 binary file
          /usr/lib/postgresql/17/bin/pg_dump "$DB_CONNECTION_STRING" -F p -f backups/backup-$(date +%Y-%m-%d).sql
        
      - name: Commit and Push Backup
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add backups/
          git commit -m "Nightly database archive: $(date +%Y-%m-%d)"
          git push
